# =====================================================================
# Configuracion de nginx para el frontend
#
# Cumple dos funciones:
#   1. Servir la aplicacion React como SPA (todo redirige a index.html).
#   2. Actuar de proxy inverso hacia el backend, de modo que el navegador
#      solo hable con un origen y CORS deje de ser un problema.
# =====================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # -----------------------------------------------------------------
    # Compresion
    # -----------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # -----------------------------------------------------------------
    # Cabeceras de seguridad
    #
    # ATENCION: aqui NO se incluyen. Los `add_header` de este bloque se
    # heredarian en `location /api/`, que es un proxy al backend, y el
    # backend ya envia las suyas con helmet. El resultado serian cabeceras
    # DUPLICADAS y contradictorias en cada respuesta de la API:
    #
    #   Referrer-Policy: no-referrer                        (helmet)
    #   Referrer-Policy: strict-origin-when-cross-origin    (nginx)
    #   Content-Security-Policy: default-src 'none'; ...    (helmet)
    #   Content-Security-Policy: default-src 'self'; ...    (nginx)
    #
    # El navegador aplica la INTERSECCION de todas las politicas de
    # seguridad que recibe, asi que enviar dos no es inofensivo: es
    # ambiguo y dificil de depurar.
    #
    # El reparto correcto de responsabilidades es:
    #   - el backend (helmet)  -> cabeceras de las respuestas de la API
    #   - nginx               -> cabeceras de los documentos que sirve el
    #                            (index.html, /assets/, 50x.html)
    #
    # Por eso el fragmento se incluye en cada `location` que sirve
    # contenido, y no en el bloque `server`.
    # -----------------------------------------------------------------

    # -----------------------------------------------------------------
    # Proxy inverso hacia el backend
    # "backend" es el nombre del servicio en docker-compose.yml.
    # -----------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Las descargas de reportes PDF/XLSX pueden tardar: ampliamos los
        # tiempos de espera respecto al valor por defecto de 60 s.
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Necesario para descargar archivos grandes (evidencias).
        proxy_buffering off;
        client_max_body_size 20m;
    }

    # -----------------------------------------------------------------
    # Assets con hash en el nombre: cache agresivo.
    # -----------------------------------------------------------------
    location /assets/ {
        # Al declarar `add_header` aqui, nginx deja de heredar las del
        # bloque `server`: hay que volver a incluirlas.
        include /etc/nginx/snippets/security-headers.conf;

        # Una sola cabecera Cache-Control. Si se usa `expires` ADEMAS de
        # `add_header Cache-Control`, nginx envia las dos y el navegador
        # recibe valores duplicados (max-age=... y public, immutable).
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # -----------------------------------------------------------------
    # Fallback de la SPA: cualquier ruta desconocida devuelve index.html
    # para que React Router maneje la navegacion del lado del cliente.
    #
    # El `index` del bloque `server` hace que `/` y las rutas de React
    # terminen en `location = /index.html` por redireccion interna, asi
    # que las cabeceras de seguridad de la pagina principal salen de alli.
    # Este `include` cubre ademas los archivos estaticos que si existen en
    # la raiz (por ejemplo 50x.html), que se sirven desde esta location.
    # -----------------------------------------------------------------
    location / {
        include /etc/nginx/snippets/security-headers.conf;

        try_files $uri $uri/ /index.html;
    }

    # El index.html nunca se cachea, para que los despliegues se vean al instante.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;

        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
