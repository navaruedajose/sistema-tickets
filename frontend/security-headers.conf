# =====================================================================
# Cabeceras de seguridad para el frontend.
#
# POR QUE ESTE ARCHIVO EXISTE:
# en nginx, los `add_header` NO se heredan del bloque padre si el bloque
# hijo define al menos uno propio. Como `location /assets/` y
# `location = /index.html` definen sus propias cabeceras de cache, las
# cabeceras de seguridad del bloque `server` se perdian en esas rutas
# (y la pagina principal se sirve justamente desde `= /index.html`).
#
# Solucion: este fragmento se incluye en cada `location` que define sus
# propios `add_header`, de modo que las cabeceras de seguridad SIEMPRE
# se envian. Es el patron idiomatico de nginx para este problema.
# =====================================================================

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;

# ---------------------------------------------------------------------
# Politica de seguridad de contenido (CSP)
#
# Es la cabecera mas valiosa de todas: aunque un atacante lograra inyectar
# HTML en la pagina, el navegador se negaria a EJECUTAR scripts que no
# procedan del propio origen. Es la defensa de fondo contra XSS, y actua
# incluso cuando la validacion de entrada falla.
#
# Por que cada directiva:
#   default-src 'self'      todo lo no listado debe ser del mismo origen.
#
#   script-src 'self'       SIN 'unsafe-inline' ni 'unsafe-eval'. Es la
#                           directiva que de verdad protege. Es seguro
#                           porque el index.html no tiene scripts en linea:
#                           todos los <script> llevan src (comprobado), y
#                           la compilacion de produccion de React/Vite no
#                           usa eval().
#
#   style-src ... 'unsafe-inline'
#                           SI hace falta, y es un compromiso consciente:
#                           index.html incluye un <style> en linea (el que
#                           evita el parpadeo blanco) y React aplica
#                           estilos con atributos style="...". Renunciar a
#                           'unsafe-inline' aqui obligaria a usar hashes o
#                           nonces en cada estilo dinamico. Inyectar CSS es
#                           mucho menos grave que inyectar JavaScript, asi
#                           que se acepta ese margen y se cierra el de los
#                           scripts, que es el que importa.
#
#   img-src ... data: blob:
#                           las evidencias se previsualizan en el navegador
#                           y algunos iconos son SVG en linea.
#
#   connect-src 'self'      la API se consume en /api/v1, mismo origen
#                           (comprobado: el bundle no contiene ninguna URL
#                           absoluta).
#
#   object-src 'none'       sin plugins (Flash, PDF embebido...), que son
#                           un vector clasico.
#   base-uri 'self'         impide secuestrar rutas relativas con <base>.
#   form-action 'self'      un formulario inyectado no puede enviar datos
#                           a un servidor externo.
#   frame-ancestors 'self'  refuerza X-Frame-Options contra clickjacking.
# ---------------------------------------------------------------------
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
